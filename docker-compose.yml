services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: sdlc, POSTGRES_USER: sdlc, POSTGRES_PASSWORD: sdlc }
    ports: ["5432:5432"]
    volumes: ["./sql/views.sql:/docker-entrypoint-initdb.d/10_views.sql:ro"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U sdlc"], interval: 5s, retries: 10 }
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  kafka:
    image: apache/kafka:3.8.0
    profiles: ["kafka"]
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
