openapi: 3.0.3
info: {title: shortener, version: "1.0"}
paths:
  /api/v1/urls:
    post:
      operationId: createShortUrl
      responses: {"201": {description: created}, "400": {description: problem}, "409": {description: conflict}}
  /{shortCode}:
    get:
      operationId: redirect
      responses: {"302": {description: redirect}, "404": {description: problem}, "410": {description: gone}}
